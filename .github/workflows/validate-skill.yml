name: validate-skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate SKILL frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          text = Path('SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---')
          end = text.find('\n---\n', 3)
          assert end != -1, 'closing frontmatter delimiter not found'
          front = yaml.safe_load(text[4:end])
          assert isinstance(front, dict)
          assert front.get('name') == 'hermes-optimizer'
          assert 'description' in front and len(front['description']) <= 1024
          body = text[end+5:].strip()
          assert body, 'skill body is empty'
          print('SKILL.md OK')
          PY
